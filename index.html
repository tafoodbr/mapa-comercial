<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Comercial</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout: mapa ocupa a tela; painel inferior com raio, filtros e lista por distância. */
:root {
  --bg: #f3f5f4; --surface: #ffffff; --fg: #18211d; --muted: #5b6862; --line: #d9e0dc;
  --accent: #0f6b5a; --accent-fg: #ffffff;
  --ativo: #1f8a4c; --cancelado: #d0661b; --cnpj: #7a4fc4; --outros: #8a948f;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #101614; --surface: #18201d; --fg: #e6ece9; --muted: #9aa8a1; --line: #2b3632;
    --accent: #3fb59a; --accent-fg: #06221b; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Login */
#login { min-height: 100%; display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
.cartao { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; }
.marca { font: 700 26px/1 var(--display); letter-spacing: .01em; margin: 0; }
.marca small { display: block; font: 500 13px/1.3 var(--body); color: var(--muted); margin-top: 6px; letter-spacing: 0; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input { padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.primario { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 12px; font-weight: 600; }
.erro { color: #c0392b; font-size: 14px; margin: 0; }

/* App */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
header h1 { font: 700 20px/1 var(--display); margin: 0; flex: 1; }
.fantasma { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
#mapa { min-height: 0; height: 100%; }
.painel { background: var(--surface); border-top: 1px solid var(--line); max-height: 46vh; display: grid; grid-template-rows: auto auto auto 1fr;
  padding: 10px max(16px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 8px; }
.linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.ponto { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.resumo { font: 600 15px/1.2 var(--display); letter-spacing: .02em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
#lista { overflow-y: auto; min-height: 0; margin: 0; padding: 0; list-style: none; }
#lista li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; }
#lista li .ponto { margin-top: 6px; }
.nome { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 13px; }
.dist { font: 600 14px/1.2 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vazio { color: var(--muted); padding: 10px 0; }
.popup h3 { font: 700 16px/1.2 var(--display); margin: 0 0 4px; }
.popup p { margin: 2px 0; }
.popup a { color: var(--accent); font-weight: 600; }
.selo { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; color: #fff; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--fg); }
.popup .links { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.popup .links a { border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; font-size: 12px; text-decoration: none; }
.popup textarea { width: 100%; min-height: 54px; margin-top: 6px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: inherit; font-size: 13px; resize: vertical; }
.popup .primario { width: 100%; margin-top: 6px; padding: 9px; }
.popup .aviso { color: var(--muted); font-size: 12px; }
.nota { font: 700 13px/1 var(--display); padding: 3px 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
select.chip { padding-right: 8px; }
.destaque { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.faixa-modo { position: absolute; z-index: 500; left: 50%; transform: translateX(-50%); top: 10px; background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 999px; font-size: 13px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); }
.faixa-modo button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
#mapa-wrap { position: relative; min-height: 0; display: grid; }
.folha { position: fixed; inset: 0; z-index: 1200; background: var(--bg); overflow-y: auto;
  padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.folha-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.folha-topo h2 { font: 700 22px/1 var(--display); margin: 0; flex: 1; }
.folha select, .folha textarea { padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: inherit; color: inherit; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.folha form, .folha .bloco { max-width: 560px; display: grid; gap: 10px; }
.folha h3 { font: 600 14px/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
.fu { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.fu .acoes { display: flex; flex-wrap: wrap; gap: 6px; }
.fu .acoes button, .fu .acoes select { font-size: 13px; }
.atrasado { color: #c0392b; font-weight: 600; }
.busca { position: relative; flex: 1 1 100%; }
.busca input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: inherit; color: inherit; }
#resultados { position: absolute; z-index: 1300; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 0; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; max-height: 60vh; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
#resultados li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
#resultados li:first-child { border-top: 0; }
#resultados li:hover, #resultados li:focus { background: var(--bg); }
#resultados li .ponto { margin-top: 6px; }
.ficha { position: fixed; z-index: 1050; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.15); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 16px; }
.ficha-topo { display: flex; justify-content: flex-end; position: sticky; top: calc(-12px - env(safe-area-inset-top)); background: var(--surface); padding: 4px 0 6px; z-index: 1; }
.ficha .popup p { margin: 4px 0; }
.ficha .popup h3 { font-size: 20px; margin: 8px 0 4px; }
@media (max-width: 700px) {
  .ficha { top: auto; left: 0; width: 100%; max-height: 72vh; border-left: 0; border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.18);
    padding-left: max(16px, env(safe-area-inset-left)); }
  .ficha-topo { top: -12px; }
}
.hist { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 6px; }
.hist li { border-left: 3px solid var(--line); padding: 2px 0 2px 8px; font-size: 13px; overflow-wrap: anywhere; }
.hist time { display: block; color: var(--muted); font-size: 11px; }
.bloco-lista { min-height: 0; display: grid; grid-template-rows: auto 1fr; }
.linha-resumo { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.modos { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.modos button { border: 0; background: var(--bg); padding: 5px 11px; font-size: 13px; }
.modos button + button { border-left: 1px solid var(--line); }
.modos button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
/* Modo Mapa: mapa em tela cheia, painel vira uma barra de resumo */
#app.modo-mapa .painel { max-height: none; grid-template-rows: auto; }
#app.modo-mapa .painel > .linha, #app.modo-mapa #lista { display: none; }
/* Modo Lista: só filtros e lista */
#app.modo-lista { grid-template-rows: auto 1fr; }
#app.modo-lista #mapa-wrap { display: none; }
#app.modo-lista .painel { max-height: none; min-height: 0; }
.voce { width: 16px; height: 16px; border-radius: 50%; background: #1d6fe0; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(29,111,224,.35); }
</style>
</head>
<body>

<section id="login">
  <form class="cartao" id="form-login">
    <h1 class="marca">Mapa Comercial<small>Clientes ativos, cancelados e oportunidades ao seu redor.</small></h1>
    <label>E-mail <input id="email" type="email" autocomplete="username" required></label>
    <label>Senha <input id="senha" type="password" autocomplete="current-password" required></label>
    <button class="primario" type="submit" id="entrar">Entrar</button>
    <p class="erro" id="erro-login" hidden></p>
  </form>
</section>

<section id="app" hidden>
  <header>
    <h1>Mapa Comercial <small class="sub" style="font:500 11px var(--body)">v25.10-0030</small></h1>
    <button class="fantasma destaque" id="btn-novo" type="button">+ Novo ponto</button>
    <button class="fantasma" id="btn-follow" type="button">Follow-up <span id="n-follow"></span></button>
    <button class="fantasma" id="btn-local" type="button">Localizar</button>
    <button class="fantasma" id="btn-sair" type="button">Sair</button>
    <div class="busca">
      <input id="busca" type="search" placeholder="Buscar nome, CNPJ ou @instagram" autocomplete="off" aria-label="Buscar cliente ou prospect">
      <ul id="resultados" hidden></ul>
    </div>
  </header>
  <div id="mapa-wrap"><div id="mapa"></div>
    <div class="faixa-modo" id="faixa-novo" hidden>Toque no mapa onde fica o estabelecimento <button type="button" id="usar-gps">Usar minha posição</button> <button type="button" id="pelo-end">Pelo endereço</button> <button type="button" id="cancelar-novo">Cancelar</button></div>
  </div>
  <div class="painel">
    <div class="linha" id="raios" role="group" aria-label="Raio da busca"></div>
    <div class="linha" id="filtros" role="group" aria-label="Filtrar por situação"></div>
    <div class="linha">
      <label class="sub" for="nota-min">Prospects</label>
      <select class="chip" id="nota-min" aria-label="Nota mínima dos prospects">
        <option value="80">Nota 80+</option><option value="60">Nota 60+</option><option value="40">Nota 40+</option><option value="0">Todas as notas</option>
      </select>
      <select class="chip" id="categoria" aria-label="Categoria dos prospects"><option value="">Todas as categorias</option></select>
      <label class="chip" for="so-novos"><input type="checkbox" id="so-novos"> Só abertos há menos de 1 ano</label>
    </div>
    <div class="bloco-lista">
      <div class="linha-resumo">
        <div class="resumo" id="resumo">Buscando sua localização…</div>
        <div class="modos" role="group" aria-label="Modo de tela">
          <button type="button" data-modo="mapa" aria-pressed="false">Mapa</button>
          <button type="button" data-modo="dividido" aria-pressed="true">Dividido</button>
          <button type="button" data-modo="lista" aria-pressed="false">Lista</button>
        </div>
      </div>
      <ul id="lista"></ul>
    </div>
  </div>
</section>

<aside class="ficha" id="ficha" hidden aria-label="Ficha do ponto">
  <div class="ficha-topo"><button class="fantasma" type="button" id="fechar-ficha">Fechar ✕</button></div>
  <div id="ficha-corpo"></div>
</aside>

<section class="folha" id="folha-novo" hidden>
  <div class="folha-topo"><h2>Novo ponto</h2><button class="fantasma" type="button" id="fechar-novo">Fechar</button></div>
  <form id="form-novo">
    <p class="sub" id="novo-local"></p>
    <label>CNPJ (opcional: se estiver na base, preenche o resto) <input id="novo-cnpj" inputmode="numeric" autocomplete="off"></label>
    <p class="aviso" id="cnpj-info"></p>
    <label>Nome do estabelecimento <input id="novo-nome" required></label>
    <label>WhatsApp / telefone (com DDD) <input id="novo-tel" inputmode="tel"></label>
    <label>CEP <input id="novo-cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000"></label>
    <p class="aviso" id="cep-info"></p>
    <label>Rua / avenida <input id="novo-end" autocomplete="address-line1"></label>
    <div class="duas"><label>Número <input id="novo-num" inputmode="numeric"></label><label>Bairro <input id="novo-bairro"></label></div>
    <div class="duas"><label>Cidade <input id="novo-cidade"></label><label>UF <input id="novo-uf" maxlength="2"></label></div>
    <label>Categoria <select id="novo-cat"></select></label>
    <label>Instagram (opcional) <input id="novo-ig" placeholder="@perfil ou link" autocomplete="off"></label>
    <label>Origem do lead <select id="novo-orig"></select></label>
    <label>Observação <textarea id="novo-obs" rows="3" placeholder="Com quem falou, interesse, melhor horário…"></textarea></label>
    <button class="primario" type="submit" id="salvar-novo">Salvar e ativar prospecção</button>
    <p class="aviso" id="msg-novo"></p>
  </form>
</section>

<section class="folha" id="folha-follow" hidden>
  <div class="folha-topo"><h2>Follow-up</h2><button class="fantasma" type="button" id="fechar-follow">Fechar</button></div>
  <div class="bloco" id="lista-follow"><p class="sub">Carregando…</p></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Configuração do projeto. A chave publicável é feita para ficar em páginas públicas:
// sem login, as regras do banco (RLS) não liberam nenhum dado.
const SUPABASE_URL = "https://wdqlucvooagrjnztkphb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_OleKOs9bUR9VQdmGN1qQ1w_ANFI_Liz";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const STATUS = {
  ATIVO: { nome: "Ativos", cor: "var(--ativo)", hex: "#1f8a4c" },
  CANCELADO: { nome: "Cancelados", cor: "var(--cancelado)", hex: "#d0661b" },
  CANCELADO_COM_CNPJ_ATIVO: { nome: "Cancelado, CNPJ ativo", cor: "var(--cnpj)", hex: "#7a4fc4" },
  OUTROS: { nome: "Outros", cor: "var(--outros)", hex: "#8a948f" },
  PROSPECT: { nome: "Prospects 80+", cor: "#2f7fd8", hex: "#2f7fd8" },
  OPORTUNIDADE: { nome: "Prospecção ativa", cor: "#14336e", hex: "#14336e" },
  REATIVACAO: { nome: "Reativação ativa", cor: "#e3b008", hex: "#e3b008" },
};
const ROTULO_FUNIL = { ATIVADO: "Prospecção ativada", PROPOSTA_ENVIADA: "Proposta enviada", EM_NEGOCIACAO: "Em negociação", GANHO: "Ganho", PERDIDO: "Perdido" };
const RAIOS = [500, 1000, 2000, 5000];
// Texto padrão do primeiro contato (definido pelo Fábio em 23/10/2026).
const MENSAGEM_PADRAO = "Olá, talvez você saiba, mas, talvez não saiba. O Sistema de Limpeza RestoClean X-10 é o maior aliado dos restaurantes no combate à gordura. Arrisco afirmar que economia de mão de obra, melhor eficiência operacional e economia de produtos de limpeza são alguns dos principais benefícios. Provavelmente algum restaurante de destaque próximo a você pode estar aplicando a nossa limpeza por imersão.\n\nVeja na prática: https://www.instagram.com/reel/DbqS_tzRrYa/";
const ASSUNTO_EMAIL = "RestoClean X-10: limpeza por imersão no combate à gordura";
const DIAS_RETORNO = 3;
const PRECISAO_APROX = { cep: "localização pelo CEP", localidade: "localização pelo bairro", logradouro: "localização pela rua" };

const CATEGORIAS = ["RESTAURANTE", "HAMBURGUERIA", "PIZZARIA", "LANCHONETE", "PADARIA", "SUPERMERCADO", "DELIVERY", "COMIDA PARA CASA", "CHURRASCARIA", "JAPONES", "REFEICAO COLETIVA", "HOTEL", "BUFE", "BAR", "CANTINA", "INDUSTRIA ALIMENTICIA", "OUTRO"];
let modoNovo = false, pontoNovo = null, marcaNovo = null;
let estado = { notaMin: 80, categoria: "", raio: 1000, filtros: new Set(["ATIVO", "CANCELADO", "CANCELADO_COM_CNPJ_ATIVO", "PROSPECT", "OPORTUNIDADE", "REATIVACAO"]), centro: null, dados: [] };
let mapa, camada, marcaVoce, circulo, visiveis = [];

const $ = (id) => document.getElementById(id);
const brl = (v) => v == null ? "—" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dataHora = (d) => d ? new Date(d).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const dataBR = (d) => d ? d.slice(0, 10).split("-").reverse().join("/") : "—";
const km = (m) => m < 1000 ? `${m} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const busca = (q) => encodeURIComponent(q);
function telWhats(t) {
  let d = String(t || "").replace(/\D/g, "").replace(/^0+/, "");
  if (d.startsWith("55") && d.length >= 12) d = d.slice(2);
  return d.length === 10 || d.length === 11 ? d : "";
}
const pareceFixo = (d) => d.length === 10 && !/^\d{2}9/.test(d);
const grupo = (d) => d.tipo === "PROSPECT" ? (d.oportunidade_status ? "OPORTUNIDADE" : "PROSPECT")
  : (d.oportunidade_status && !["GANHO", "PERDIDO"].includes(d.oportunidade_status) ? "REATIVACAO" : d.status_local);
// Chave única de cada ponto no funil: CNPJ (prospect) ou "L:" + chave do endereço (cliente cancelado).
const chaveDe = (d) => d.tipo === "LOCAL" ? "L:" + d.chave_local : d.cnpj;
const idk = (k) => String(k).replace(/[^A-Za-z0-9_-]/g, "_");
const alvo = (k) => k.startsWith("L:") ? ["chave_local", k.slice(2)] : ["cnpj", k];
const acharPorChave = (k) => estado.dados.find((x) => chaveDe(x) === k);
const PODE_REATIVAR = ["CANCELADO", "CANCELADO_COM_CNPJ_ATIVO"];
const ORIGENS = ["Mapa (prospect)", "Visita de campo", "iFood Super Restaurante", "Instagram", "Google Maps", "Indicação", "Reativação", "Outro"];
const opcoesOrigem = (padrao) => ORIGENS.map((o) => `<option${o === padrao ? " selected" : ""}>${o}</option>`).join("");
const NOME_CANAL = { WHATSAPP: "WhatsApp", EMAIL: "e-mail", INSTAGRAM: "Instagram" };
const limparInstagram = (t) => String(t || "").trim().toLowerCase().replace(/^.*instagram\.com\//, "").replace(/^@/, "")
  .replace(/[/?#].*$/, "").replace(/[^a-z0-9._]/g, "");

// Login
$("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("entrar").disabled = true; $("erro-login").hidden = true;
  const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
  $("entrar").disabled = false;
  if (error) { $("erro-login").textContent = "E-mail ou senha incorretos. Confira e tente de novo."; $("erro-login").hidden = false; return; }
  abrirApp();
});
$("btn-sair").addEventListener("click", async () => { await db.auth.signOut(); location.reload(); });
db.auth.getSession().then(({ data }) => { if (data.session) abrirApp(); });

function abrirApp() {
  if (mapa) return;
  $("login").hidden = true; $("app").hidden = false;
  mapa = L.map("mapa", { zoomControl: false }).setView([-23.55, -46.63], 13);
  L.control.zoom({ position: "topright" }).addTo(mapa);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(mapa);
  camada = L.layerGroup().addTo(mapa);
  mapa.on("click", (e) => modoNovo ? escolherPonto(e.latlng.lat, e.latlng.lng) : buscar(e.latlng.lat, e.latlng.lng, false));
  montarNovoEFollow();
  montarBusca();
  montarModos();
  $("fechar-ficha").onclick = fecharFicha;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("ficha").hidden) fecharFicha(); });
  contarFollow();
  document.addEventListener("click", ativarPeloBotao);
  montarControles();
  localizar();
}

function montarControles() {
  $("raios").innerHTML = RAIOS.map((r) => `<button type="button" class="chip" data-raio="${r}" aria-pressed="${r === estado.raio}">${km(r)}</button>`).join("");
  $("raios").onclick = (e) => {
    const b = e.target.closest("[data-raio]"); if (!b) return;
    estado.raio = +b.dataset.raio;
    [...$("raios").children].forEach((c) => c.setAttribute("aria-pressed", c === b));
    if (estado.centro) buscar(estado.centro[0], estado.centro[1], false);
  };
  $("filtros").innerHTML = Object.entries(STATUS).map(([k, s]) =>
    `<button type="button" class="chip" data-st="${k}" aria-pressed="${estado.filtros.has(k)}"><span class="ponto" style="background:${s.cor}"></span>${s.nome} <span data-n="${k}"></span></button>`).join("");
  $("filtros").onclick = (e) => {
    const b = e.target.closest("[data-st]"); if (!b) return;
    const k = b.dataset.st;
    estado.filtros.has(k) ? estado.filtros.delete(k) : estado.filtros.add(k);
    b.setAttribute("aria-pressed", estado.filtros.has(k));
    desenhar();
  };
  $("btn-local").onclick = localizar;
  $("nota-min").onchange = (e) => { estado.notaMin = +e.target.value; if (estado.centro) buscar(estado.centro[0], estado.centro[1], false); };
  $("categoria").innerHTML += CATEGORIAS.filter((c) => c !== "OUTRO").map((c) => `<option value="${c}">${c[0] + c.slice(1).toLowerCase()}</option>`).join("");
  $("categoria").onchange = (e) => { estado.categoria = e.target.value; desenhar(); };
  $("so-novos").onchange = (e) => { estado.soNovos = e.target.checked; desenhar(); };
}

function localizar() {
  if (!navigator.geolocation) { $("resumo").textContent = "Toque no mapa para buscar ao redor de um ponto."; return; }
  $("resumo").textContent = "Buscando sua localização…";
  navigator.geolocation.getCurrentPosition(
    (p) => buscar(p.coords.latitude, p.coords.longitude, true),
    () => { $("resumo").textContent = "Localização não liberada. Toque no mapa para buscar ao redor de um ponto."; },
    { enableHighAccuracy: true, timeout: 12000 }
  );
}

async function buscar(lat, lon, ehVoce) {
  estado.centro = [lat, lon];
  if (ehVoce) {
    if (marcaVoce) marcaVoce.remove();
    marcaVoce = L.marker([lat, lon], { icon: L.divIcon({ className: "", html: '<div class="voce"></div>', iconSize: [16, 16] }), interactive: false }).addTo(mapa);
  }
  if (circulo) circulo.remove();
  circulo = L.circle([lat, lon], { radius: estado.raio, color: "#0f6b5a", weight: 1, fillOpacity: 0.05 }).addTo(mapa);
  mapa.fitBounds(circulo.getBounds(), { padding: [10, 10] });
  $("resumo").textContent = "Buscando…";
  const args = { p_lat: lat, p_lon: lon, p_raio_m: estado.raio };
  const [loc, pro] = await Promise.all([db.rpc("locais_proximos", args), db.rpc("prospects_proximos", { ...args, p_nota_min: estado.notaMin })]);
  if (loc.error) { $("resumo").textContent = "Não foi possível buscar os clientes: " + loc.error.message; return; }
  const prospects = pro.error ? [] : (pro.data || []);
  estado.dados = [
    ...(loc.data || []).map((d) => ({ ...d, tipo: "LOCAL" })),
    ...prospects.map((d) => ({ ...d, tipo: "PROSPECT", cliente: d.nome })),
  ].sort((x, y) => x.distancia_m - y.distancia_m);
  estado.avisoProspects = pro.error ? "Prospects indisponíveis: " + pro.error.message : "";
  desenhar();
}

function desenhar() {
  camada.clearLayers();
  visiveis = estado.dados.filter((d) => estado.filtros.has(grupo(d))
    && (!estado.categoria || d.tipo !== "PROSPECT" || d.segmento === estado.categoria)
    && (!estado.soNovos || d.tipo !== "PROSPECT" || d.anos_de_abertura === 0));
  for (const k of Object.keys(STATUS)) {
    const n = estado.dados.filter((d) => grupo(d) === k).length;
    const el = document.querySelector(`[data-n="${k}"]`); if (el) el.textContent = n ? `· ${n}` : "";
  }
  const mens = estado.dados.filter((d) => d.status_local === "ATIVO").reduce((s, d) => s + Number(d.mensalidade_ativa || 0), 0);
  const nPros = estado.dados.filter((d) => d.tipo === "PROSPECT").length;
  $("resumo").textContent = estado.avisoProspects ||
    `${visiveis.length} pontos em ${km(estado.raio)} · ${brl(mens)}/mês ativos · ${nPros} prospects`;
  const itens = [];
  visiveis.forEach((d, i) => {
    const s = STATUS[grupo(d)] || STATUS.OUTROS;
    const ehP = d.tipo === "PROSPECT";
    d._m = L.circleMarker([d.latitude, d.longitude], {
      radius: ehP ? 6 : 7, color: "#fff", weight: 2, fillColor: s.hex, fillOpacity: 0.95, bubblingMouseEvents: false,
    }).on("click", () => abrirFicha(d)).addTo(camada);
    const sub = ehP
      ? `${d.anos_de_abertura === 0 ? "<b>NOVO</b> · " : ""}${esc(d.segmento)} · ${d.nota == null ? "cadastrado em campo" : "nota " + d.nota}${d.expansao_rede ? " · rede de cliente" : ""} · ${esc(d.bairro)}`
      : `${esc(d.endereco)} · ${esc(d.bairro)}${d.vendedor ? " · " + esc(d.vendedor) : ""}`;
    itens.push(`<li data-i="${i}"><span class="ponto" style="background:${s.cor}"></span><div><div class="nome">${esc(d.cliente || d.endereco)}</div><div class="sub">${sub}</div></div><div class="dist">${km(d.distancia_m)}</div></li>`);
  });
  $("lista").innerHTML = itens.join("") || `<li class="vazio" style="display:block;cursor:default">Nada nesse raio com os filtros escolhidos. Aumente o raio ou toque em outro ponto do mapa.</li>`;
  $("lista").onclick = (e) => {
    const li = e.target.closest("[data-i]"); if (!li) return;
    const d = visiveis[+li.dataset.i]; mapa.setView([d.latitude, d.longitude], Math.max(mapa.getZoom(), 16)); abrirFicha(d);
  };
  // mantém a ficha aberta e atualizada depois de redesenhar
  if (fichaChave) { const d = acharPorChave(fichaChave); if (d && d._m) abrirFicha(d); else fecharFicha(); }
}

// Modos de tela: Mapa (cheio) | Dividido | Lista (cheia). Lembra a última escolha neste navegador.
function aplicarModo(modo) {
  $("app").classList.remove("modo-mapa", "modo-dividido", "modo-lista");
  $("app").classList.add("modo-" + modo);
  document.querySelectorAll("[data-modo]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.modo === modo));
  try { localStorage.setItem("modoTela", modo); } catch { /* sem armazenamento: segue sem lembrar */ }
  setTimeout(() => mapa && mapa.invalidateSize(), 50);
}
function montarModos() {
  document.querySelector(".modos").addEventListener("click", (e) => {
    const b = e.target.closest("[data-modo]"); if (b) aplicarModo(b.dataset.modo);
  });
  let modo = "dividido";
  try { modo = localStorage.getItem("modoTela") || "dividido"; } catch { /* padrão */ }
  aplicarModo(modo);
}

// Ficha fixa na tela (não se move com o mapa)
let fichaChave = null, marcaSel = null;
function abrirFicha(d) {
  if (modoNovo) sairModoNovo();
  const s = STATUS[grupo(d)] || STATUS.OUTROS;
  fichaChave = chaveDe(d);
  $("ficha-corpo").innerHTML = d.tipo === "PROSPECT" ? popupProspect(d, s) : popupLocal(d, s);
  $("ficha").hidden = false;
  if (d.oportunidade_status) carregarAnotacoes(fichaChave);
  if (marcaSel) marcaSel.remove();
  marcaSel = L.circleMarker([d.latitude, d.longitude], { radius: 14, color: s.hex, weight: 3, fill: false, interactive: false }).addTo(mapa);
}
const oportId = {};
function listaAnotacoes(notas) {
  return notas.length ? notas.slice().sort((a, b) => b.criado_em.localeCompare(a.criado_em))
    .map((n) => `<li><time>${dataHora(n.criado_em)}</time>${esc(n.texto)}</li>`).join("")
    : '<li class="sub">Nenhuma anotação ainda.</li>';
}
async function carregarAnotacoes(k) {
  const lista = document.getElementById("anot-" + idk(k)); if (!lista) return;
  const [col, val] = alvo(k);
  const { data, error } = await db.from("oportunidades").select("id,anotacoes(texto,criado_em)").eq(col, val).maybeSingle();
  if (error || !data) { lista.innerHTML = '<li class="sub">Anotações indisponíveis (falta rodar o SQL de anotações).</li>'; return; }
  oportId[k] = data.id;
  lista.innerHTML = listaAnotacoes(data.anotacoes || []);
}
async function anotar(b) {
  const k = b.dataset.anotar, i = idk(k), campo = document.getElementById("anotx-" + i);
  const texto = campo.value.trim(); if (!texto) { campo.focus(); return; }
  if (!oportId[k]) await carregarAnotacoes(k);
  b.disabled = true; b.textContent = "Salvando…";
  const { error } = await db.from("anotacoes").insert({ oportunidade_id: oportId[k], texto });
  b.disabled = false; b.textContent = "Salvar anotação";
  if (error) { document.getElementById("anot-" + i).insertAdjacentHTML("afterbegin", `<li class="erro">Não foi possível salvar: ${esc(error.message)}</li>`); return; }
  campo.value = "";
  carregarAnotacoes(k);
}

function fecharFicha() {
  fichaChave = null; $("ficha").hidden = true;
  if (marcaSel) { marcaSel.remove(); marcaSel = null; }
}

function aproximado(d) {
  return PRECISAO_APROX[d.geo_precisao] ? `<p class="aviso">Ponto aproximado (${PRECISAO_APROX[d.geo_precisao]})</p>` : "";
}

function blocoFunil(d, rotuloAtivar, telefones, email) {
  const k = chaveDe(d), i = idk(k), ke = esc(k);
  const tel1 = telefones.map(telWhats).find(Boolean) || "";
  const envio = `<p style="margin-top:8px"><b>Enviar proposta</b></p>
       <label>WhatsApp (DDD + número)<input id="wa-${i}" inputmode="tel" value="${tel1}"></label>
       ${tel1 && pareceFixo(tel1) ? `<p class="aviso">Esse número parece fixo; o WhatsApp pode não abrir. Confira um celular no Google Maps.</p>` : ""}
       <button type="button" class="primario" data-whats="${ke}">Abrir WhatsApp com a mensagem</button>
       <label style="margin-top:6px">E-mail<input id="em-${i}" type="email" value="${esc(email || "")}"></label>
       <button type="button" class="fantasma" style="width:100%;margin-top:6px" data-email="${ke}">Abrir e-mail com a mensagem</button>
       ${d.instagram
         ? `<input type="hidden" id="igenv-${i}" value="${esc(d.instagram)}">
            <button type="button" class="fantasma" style="width:100%;margin-top:6px" data-insta="${ke}">Copiar mensagem e abrir Direct para @${esc(d.instagram)}</button>`
         : `<label style="margin-top:6px">Instagram (@) <span class="aviso">salvo automaticamente ao enviar</span><input id="igenv-${i}" placeholder="@perfil ou link"></label>
            <button type="button" class="fantasma" style="width:100%;margin-top:6px" data-insta="${ke}">Copiar mensagem e abrir Direct</button>`}
       <p class="aviso" id="env-${i}"></p>`;
  if (!d.oportunidade_status) {
    return `<label>Origem do lead <select id="orig-${i}">${opcoesOrigem(d.tipo === "LOCAL" ? "Reativação" : "Mapa (prospect)")}</select></label>
       <textarea id="obs-${i}" placeholder="Observação (opcional): com quem falou, interesse, melhor horário…"></textarea>
       <button type="button" class="primario" data-ativar="${ke}">${rotuloAtivar}</button>
       <p class="aviso" id="msg-${i}"></p>`;
  }
  const rotuloStatus = d.tipo === "LOCAL" && d.oportunidade_status === "ATIVADO" ? "Reativação ativada" : (ROTULO_FUNIL[d.oportunidade_status] || d.oportunidade_status);
  const anot = `<p style="margin-top:12px"><b>Anotações</b></p>
       <textarea id="anotx-${i}" rows="2" placeholder="Nova anotação: com quem falou, o que ficou combinado…"></textarea>
       <button type="button" class="fantasma" style="width:100%;margin-top:6px" data-anotar="${ke}">Salvar anotação</button>
       <ul class="hist" id="anot-${i}"><li class="sub">Carregando…</li></ul>`;
  return `<p><b>${rotuloStatus}</b>${d.oportunidade_status === "ATIVADO" ? " em " + dataBR(d.ativado_em) : ""}</p>${d.observacao ? `<p class="aviso">${esc(d.observacao)}</p>` : ""}
       ${anot}
       ${["ATIVADO", "PROPOSTA_ENVIADA"].includes(d.oportunidade_status) ? envio : ""}`;
}

function blocoSituacao(d) {
  if (d.tipo === "LOCAL" && d.status_local === "ATIVO") return "";
  const ke = esc(chaveDe(d)), i = idk(chaveDe(d));
  return `<details style="margin-top:14px"><summary class="sub" style="cursor:pointer">O ponto fechou ou mudou de dono?</summary>
    <div class="acoes" style="display:grid;gap:6px;margin-top:6px">
      <button type="button" class="fantasma" data-fechado="${ke}">Fechado / não existe mais</button>
      <button type="button" class="fantasma" data-abriu-outro="${ke}">Abriu outro negócio no lugar</button>
      <p class="aviso" id="sit-${i}"></p></div></details>`;
}

function popupLocal(d, s) {
  const valor = d.status_local === "ATIVO"
    ? `Mensalidade ativa: <b>${brl(d.mensalidade_ativa)}</b>`
    : `Última mensalidade: <b>${brl(d.mensalidade_ultimo_contrato)}</b>`;
  const rota = `https://www.google.com/maps/dir/?api=1&destination=${d.latitude},${d.longitude}`;
  return `<div class="popup"><span class="selo" style="background:${s.hex}">${s.nome}</span>
    <h3>${esc(d.cliente)}</h3>
    <p>${esc(d.endereco)} · ${esc(d.bairro)}, ${esc(d.cidade)}</p>
    <p>${valor} · Modelo: ${esc(d.modelo || "—")}</p>
    <p>Instalação: ${dataBR(d.dt_instalacao)} · Vendedor: ${esc(d.vendedor || "—")}</p>
    <p>Contato: ${esc(d.contato || "—")}</p>${aproximado(d)}
    <div class="links"><a href="https://www.google.com/search?q=${busca("site:instagram.com " + d.cliente + " " + d.cidade)}" target="_blank" rel="noopener">Buscar no Instagram</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${busca(d.cliente + " " + d.endereco + " " + d.cidade)}" target="_blank" rel="noopener">Google Maps</a></div>
    ${blocoInstagram(d)}
    <p><a href="${rota}" target="_blank" rel="noopener">Abrir rota</a> · ${km(d.distancia_m)} daqui</p>
    ${PODE_REATIVAR.includes(d.status_local) || d.oportunidade_status ? blocoFunil(d, "Ativar reativação", [d.contato], "") : ""}
    ${blocoSituacao(d)}</div>`;
}

function popupProspect(d, s) {
  const onde = `${d.nome} ${d.endereco} ${d.cidade}`;
  const nomeCidade = `${d.nome} ${d.cidade}`;
  const links = [
    ["Google Maps", `https://www.google.com/maps/search/?api=1&query=${busca(onde)}`],
    ["Instagram", `https://www.google.com/search?q=${busca("site:instagram.com " + nomeCidade)}`],
    ["TripAdvisor", `https://www.google.com/search?q=${busca("site:tripadvisor.com.br " + nomeCidade)}`],
    ["iFood", `https://www.google.com/search?q=${busca("site:ifood.com.br " + nomeCidade)}`],
    ["Michelin", `https://www.google.com/search?q=${busca("site:guide.michelin.com " + nomeCidade)}`],
  ].map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("");
  const tel = [d.telefone1, d.telefone2].filter(Boolean).map(esc).join(" · ") || "—";
  const rota = `https://www.google.com/maps/dir/?api=1&destination=${d.latitude},${d.longitude}`;
  const funil = blocoFunil(d, "Ativar prospecção", [d.telefone1, d.telefone2], d.email);
  return `<div class="popup"><span class="selo" style="background:${s.hex}">${s.nome}</span> <span class="nota">${d.nota == null ? "Campo" : "Nota " + d.nota}</span>
    <h3>${esc(d.nome)}</h3>
    <p>${d.anos_de_abertura === 0 ? '<span class="selo" style="background:#1f8a4c">Aberto há menos de 1 ano</span> ' : ""}${esc(d.segmento)}${d.expansao_rede ? " · <b>outra unidade de um cliente</b>" : ""}</p>
    <p>${esc(d.endereco)} · ${esc(d.bairro)}, ${esc(d.cidade)}</p>
    <p>Telefone: ${tel}</p>
    <p>${esc(d.porte || "—")} · ${d.anos_de_abertura ?? "—"} anos de CNPJ${d.unidades_na_regiao > 1 ? ` · ${d.unidades_na_regiao} unidades` : ""}</p>${aproximado(d)}
    <div class="links">${links}</div>
    ${blocoInstagram(d)}
    <p><a href="${rota}" target="_blank" rel="noopener">Abrir rota</a> · ${km(d.distancia_m)} daqui</p>
    ${funil}
    ${blocoSituacao(d)}</div>`;
}

function blocoInstagram(d) {
  const k = chaveDe(d), i = idk(k);
  const envioAberto = ["ATIVADO", "PROPOSTA_ENVIADA"].includes(d.oportunidade_status);
  if (d.instagram) {
    return `<div class="links"><b>@${esc(d.instagram)}</b>
      <a href="https://www.instagram.com/${encodeURIComponent(d.instagram)}/" target="_blank" rel="noopener">Ver perfil</a>
      <a href="https://ig.me/m/${encodeURIComponent(d.instagram)}" target="_blank" rel="noopener">Mandar Direct</a></div>`;
  }
  if (envioAberto) return "";   // o @ é informado no bloco "Enviar proposta"
  return `<div class="duas" style="align-items:end;margin-top:4px">
      <label>Instagram (@) <input id="ig-${i}" placeholder="@perfil ou link"></label>
      <button type="button" class="fantasma" data-ig-salvar="${esc(k)}">Salvar @</button></div>
    <p class="aviso" id="igmsg-${i}"></p>`;
}

async function gravarInstagram(k, valor) {
  const [col, val] = alvo(k);
  const { data, error } = col === "cnpj"
    ? await db.rpc("salvar_instagram", { p_cnpj: val, p_instagram: valor })
    : await db.rpc("salvar_instagram_local", { p_chave_local: val, p_instagram: valor });
  if (!error && data) { const d = acharPorChave(k); if (d) d.instagram = data; }
  return { data, error };
}

async function salvarInstagram(k) {
  const i = idk(k), campo = document.getElementById("ig-" + i), msg = document.getElementById("igmsg-" + i);
  const { data, error } = await gravarInstagram(k, campo.value);
  if (error) { msg.textContent = "Não foi possível salvar: " + error.message; return; }
  if (!data) { msg.textContent = "Digite o @ do perfil, por exemplo @restaurante."; return; }
  const d = acharPorChave(k);
  if (d) abrirFicha(d);
}

async function ativarPeloBotao(e) {
  if (e.target.closest("[data-ig-salvar]")) return salvarInstagram(e.target.closest("[data-ig-salvar]").dataset.igSalvar);
  if (e.target.closest("[data-whats]")) return abrirEnvio(e.target.closest("[data-whats]").dataset.whats, "WHATSAPP");
  if (e.target.closest("[data-email]")) return abrirEnvio(e.target.closest("[data-email]").dataset.email, "EMAIL");
  if (e.target.closest("[data-insta]")) return abrirEnvio(e.target.closest("[data-insta]").dataset.insta, "INSTAGRAM");
  if (e.target.closest("[data-enviei]")) return confirmarEnvio(e.target.closest("[data-enviei]"));
  if (e.target.closest("[data-anotar]")) return anotar(e.target.closest("[data-anotar]"));
  if (e.target.closest("[data-fechado]")) return pedirConfirmacaoFechado(e.target.closest("[data-fechado]").dataset.fechado, false);
  if (e.target.closest("[data-abriu-outro]")) return pedirConfirmacaoFechado(e.target.closest("[data-abriu-outro]").dataset.abriuOutro, true);
  if (e.target.closest("[data-confirma-fechado]")) return marcarFechado(e.target.closest("[data-confirma-fechado]"));
  const b = e.target.closest("[data-ativar]"); if (!b) return;
  const k = b.dataset.ativar, i = idk(k), [col, val] = alvo(k);
  const obs = (document.getElementById("obs-" + i)?.value || "").trim();
  const msg = document.getElementById("msg-" + i);
  const rotulo = b.textContent;
  b.disabled = true; b.textContent = "Ativando…";
  const origem = document.getElementById("orig-" + i)?.value || null;
  const novo = { [col]: val, observacao: obs || null, tipo: col === "chave_local" ? "REATIVACAO" : "PROSPECCAO", origem };
  const { error } = await db.from("oportunidades").insert(novo);
  if (error) {
    b.disabled = false; b.textContent = rotulo;
    msg.textContent = error.code === "23505" ? "Já foi ativado por outro vendedor." : "Não foi possível ativar: " + error.message;
    return;
  }
  const d = acharPorChave(k);
  if (d) { d.oportunidade_status = "ATIVADO"; d.ativado_em = new Date().toISOString(); d.observacao = obs; }
  desenhar(); contarFollow();
}

function abrirEnvio(k, canal) {
  const i = idk(k), msg = document.getElementById("env-" + i);
  let destino, link;
  if (canal === "INSTAGRAM") {
    const h = limparInstagram(document.getElementById("igenv-" + i).value);
    if (!h) { msg.textContent = "Digite o @ do perfil, por exemplo @restaurante."; return; }
    // O Direct não aceita texto pronto: a mensagem vai para a área de transferência e é só colar.
    let copiou = true;
    try { navigator.clipboard.writeText(MENSAGEM_PADRAO).catch(() => { copiou = false; }); } catch { copiou = false; }
    window.open(`https://ig.me/m/${encodeURIComponent(h)}`, "_blank", "noopener");
    gravarInstagram(k, h);   // salva o @ no cadastro
    destino = "@" + h;
    msg.innerHTML = `Mensagem copiada: no Direct, toque e segure na caixa de texto e escolha <b>Colar</b>. ` +
      `Enviou? <button type="button" class="primario" data-enviei="${esc(k)}" data-canal="INSTAGRAM" data-destino="${esc(destino)}">Sim, enviei</button>`;
    setTimeout(() => { if (!copiou) msg.insertAdjacentHTML("afterbegin", `<span class="erro">Não consegui copiar sozinho. Copie o texto abaixo:</span><br><textarea readonly rows="4">${esc(MENSAGEM_PADRAO)}</textarea>`); }, 300);
    return;
  }
  if (canal === "WHATSAPP") {
    destino = telWhats(document.getElementById("wa-" + i).value);
    if (!destino) { msg.textContent = "Digite o WhatsApp com DDD, por exemplo 11 91234-5678."; return; }
    link = `https://wa.me/55${destino}?text=${encodeURIComponent(MENSAGEM_PADRAO)}`;
  } else {
    destino = document.getElementById("em-" + i).value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(destino)) { msg.textContent = "Digite um e-mail válido."; return; }
    link = `mailto:${destino}?subject=${encodeURIComponent(ASSUNTO_EMAIL)}&body=${encodeURIComponent(MENSAGEM_PADRAO)}`;
  }
  window.open(link, "_blank", "noopener");
  const nome = canal === "WHATSAPP" ? "WhatsApp" : "e-mail";
  msg.innerHTML = `Enviou pelo ${nome}? <button type="button" class="primario" data-enviei="${esc(k)}" data-canal="${canal}" data-destino="${esc(destino)}">Sim, enviei</button>`;
}

async function confirmarEnvio(b) {

async function localizarEndereco() {
  const rua = $("novo-end").value.trim(), num = $("novo-num").value.trim();
  const cidade = $("novo-cidade").value.trim(), uf = $("novo-uf").value.trim(), cep = $("novo-cep").value.replace(/\D/g, "");
  if (!rua || !cidade) return null;
  const nomi = (params) => fetch("https://nominatim.openstreetmap.org/search?" +
    new URLSearchParams({ format: "jsonv2", limit: "1", countrycodes: "br", ...params })).then((r) => r.json())
    .then((r) => r.length ? [+r[0].lat, +r[0].lon] : null);
  const photon = (q) => fetch("https://photon.komoot.io/api/?" + new URLSearchParams({ q, limit: "1", lat: "-23.55", lon: "-46.63" }))
    .then((r) => r.json()).then((j) => j.features && j.features.length ? [j.features[0].geometry.coordinates[1], j.features[0].geometry.coordinates[0]] : null);
  const tentativas = [
    () => nomi({ street: `${num} ${rua}`.trim(), city: cidade, state: uf }),
    () => nomi({ q: `${rua}, ${num}, ${cidade}, ${uf}, Brasil` }),
    () => photon(`${rua} ${num} ${cidade} ${uf}`),
    () => nomi({ street: rua, city: cidade, state: uf }),
    () => cep.length === 8 ? nomi({ postalcode: cep }) : null,
  ];
  for (const t of tentativas) {
    try { const r = await t(); if (r) return r; } catch { /* tenta a próxima */ }
  }
  return null;
}

function escolherPonto(lat, lon) {
  pontoNovo = [lat, lon];
  if (marcaNovo) marcaNovo.remove();
  marcaNovo = L.circleMarker([lat, lon], { radius: 9, color: "#fff", weight: 3, fillColor: "#14336e", fillOpacity: 1 }).addTo(mapa);
  $("faixa-novo").hidden = true;
  $("novo-local").textContent = `Local marcado: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  $("msg-novo").textContent = "";
  $("folha-novo").hidden = false;
  $("novo-nome").focus();
}

async function salvarNovo(e) {
  e.preventDefault();
  const b = $("salvar-novo"); b.disabled = true; b.textContent = "Salvando…";
  if (!pontoNovo) {
    pontoNovo = cnpjBase && cnpjBase.lat != null ? [cnpjBase.lat, cnpjBase.lon] : await localizarEndereco();
    if (!pontoNovo) {
      b.disabled = false; b.textContent = "Salvar e ativar prospecção";
      $("msg-novo").innerHTML = 'Não encontrei esse endereço no mapa. <button type="button" class="primario" id="marcar-no-mapa" style="width:100%;margin-top:6px">Marcar no mapa (os dados ficam guardados)</button>';
      $("marcar-no-mapa").onclick = () => {
        $("folha-novo").hidden = true; modoNovo = true; $("faixa-novo").hidden = false;
        if (estado.centro) mapa.setView(estado.centro, 15);
      };
      return;
    }
  }
  const { data, error } = await db.rpc("novo_ponto", {
    p_nome: $("novo-nome").value, p_telefone: $("novo-tel").value.trim() || null,
    p_lat: pontoNovo[0], p_lon: pontoNovo[1], p_segmento: $("novo-cat").value,
    p_observacao: $("novo-obs").value.trim() || null, p_cnpj: $("novo-cnpj").value.trim() || null,
    p_cep: $("novo-cep").value.trim() || null, p_endereco: $("novo-end").value.trim() || null,
    p_numero: $("novo-num").value.trim() || null, p_bairro: $("novo-bairro").value.trim() || null,
    p_cidade: $("novo-cidade").value.trim() || null, p_uf: $("novo-uf").value.trim() || null,
  });
  b.disabled = false; b.textContent = "Salvar e ativar prospecção";
  if (error) {
    $("msg-novo").textContent = error.code === "23505" ? "Esse CNPJ já está ativado no funil." : "Não foi possível salvar: " + error.message;
    return;
  }
  if ($("novo-ig").value.trim()) await db.rpc("salvar_instagram", { p_cnpj: data, p_instagram: $("novo-ig").value });
  await db.from("oportunidades").update({ origem: $("novo-orig").value }).eq("cnpj", data);
  $("form-novo").reset(); $("novo-orig").value = "Visita de campo"; $("cep-info").textContent = ""; $("cnpj-info").textContent = ""; cnpjBase = null; ultimoCnpj = ""; ultimoCep = "";
  $("folha-novo").hidden = true; sairModoNovo();
  await buscar(pontoNovo[0], pontoNovo[1], false);
  const d = estado.dados.find((x) => x.cnpj === data);
  if (d && d._m) abrirFicha(d);
  contarFollow();
}

// Preenche rua, bairro, cidade e UF a partir do CEP (ViaCEP, serviço público e gratuito).
let ultimoCep = "";
async function buscarCep() {
  const cep = $("novo-cep").value.replace(/\D/g, "");
  if (cep.length !== 8 || cep === ultimoCep) return;
  ultimoCep = cep;
  $("cep-info").textContent = "Buscando CEP…";
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j = await r.json();
    if (j.erro) { $("cep-info").textContent = "CEP não encontrado. Preencha o endereço à mão."; return; }
    $("novo-end").value = j.logradouro || $("novo-end").value;
    $("novo-bairro").value = j.bairro || $("novo-bairro").value;
    $("novo-cidade").value = j.localidade || "";
    $("novo-uf").value = j.uf || "";
    $("cep-info").textContent = "Endereço preenchido pelo CEP. Falta só o número.";
    $("novo-num").focus();
  } catch {
    $("cep-info").textContent = "Não foi possível consultar o CEP agora. Preencha o endereço à mão.";
  }
}

// Se o CNPJ já está na base da Receita, preenche nome, telefone e endereço.
let ultimoCnpj = "", cnpjBase = null;
async function buscarCnpj() {
  const cnpj = $("novo-cnpj").value.replace(/\D/g, "");
  if (cnpj.length !== 14 || cnpj === ultimoCnpj) return;
  ultimoCnpj = cnpj;
  const { data } = await db.from("prospects")
    .select("nome_fantasia,razao_social,telefone1,cep,endereco,numero,bairro,cidade,uf,segmento,nota,latitude,longitude,instagram")
    .eq("cnpj", cnpj).maybeSingle();
  cnpjBase = data ? { lat: data.latitude, lon: data.longitude } : null;
  if (!data) { await buscarCnpjBrasilApi(cnpj); return; }
  $("novo-nome").value = data.nome_fantasia || data.razao_social || "";
  $("novo-tel").value = data.telefone1 || "";
  $("novo-cep").value = data.cep || ""; ultimoCep = data.cep || "";
  $("novo-end").value = data.endereco || "";
  $("novo-num").value = data.numero || "";
  $("novo-bairro").value = data.bairro || "";
  $("novo-cidade").value = data.cidade || "";
  $("novo-uf").value = data.uf || "";
  if (CATEGORIAS.includes(data.segmento)) $("novo-cat").value = data.segmento;
  if (data.instagram && !$("novo-ig").value) $("novo-ig").value = data.instagram;
  $("cnpj-info").textContent = `Encontrado na base da Receita${data.nota != null ? " (nota " + data.nota + ")" : ""}. Ao salvar, ele é ativado no ponto que já está no mapa.`;
}

// CNPJ fora da nossa base (MEI, outra cidade): consulta a BrasilAPI, serviço público com dados da Receita.
async function buscarCnpjBrasilApi(cnpj) {
  $("cnpj-info").textContent = "Não está na nossa base. Consultando a Receita…";
  try {
    const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
    if (!r.ok) throw new Error();
    const j = await r.json();
    if (!$("novo-nome").value) $("novo-nome").value = j.nome_fantasia || j.razao_social || "";
    if (!$("novo-tel").value && j.ddd_telefone_1) $("novo-tel").value = j.ddd_telefone_1;
    if (j.cep) { $("novo-cep").value = j.cep; ultimoCep = String(j.cep).replace(/\D/g, ""); }
    const rua = [j.descricao_tipo_de_logradouro, j.logradouro].filter(Boolean).join(" ");
    if (rua) $("novo-end").value = rua;
    if (j.numero) $("novo-num").value = j.numero;
    if (j.bairro) $("novo-bairro").value = j.bairro;
    if (j.municipio) $("novo-cidade").value = j.municipio;
    if (j.uf) $("novo-uf").value = j.uf;
    const sit = j.descricao_situacao_cadastral ? ` Situação: ${j.descricao_situacao_cadastral}.` : "";
    $("cnpj-info").textContent = `Dados preenchidos pela Receita (fora da nossa base de prospects).${sit}`;
  } catch {
    $("cnpj-info").textContent = "CNPJ não encontrado na nossa base nem na consulta da Receita. Preencha os dados abaixo.";
  }
}

// ---------- Busca por nome, CNPJ ou Instagram ----------
let temporizadorBusca = null, resultadosBusca = [];
function montarBusca() {
  $("busca").addEventListener("input", () => {
    clearTimeout(temporizadorBusca);
    const t = $("busca").value.trim();
    if (t.length < 3) { $("resultados").hidden = true; return; }
    temporizadorBusca = setTimeout(() => pesquisar(t), 350);
  });
  $("resultados").addEventListener("click", (e) => {
    const li = e.target.closest("[data-r]"); if (li) irPara(resultadosBusca[+li.dataset.r]);
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".busca")) $("resultados").hidden = true; });
}

async function pesquisar(t) {
  const { data, error } = await db.rpc("buscar_pontos", { p_texto: t });
  if (t !== $("busca").value.trim()) return;
  resultadosBusca = data || [];
  const cor = (r) => r.tipo === "LOCAL" ? (STATUS[r.situacao] || STATUS.OUTROS).cor
    : (r.situacao === "PROSPECT" ? STATUS.PROSPECT.cor : STATUS.OPORTUNIDADE.cor);
  const rotulo = (r) => r.tipo === "LOCAL" ? (STATUS[r.situacao] || STATUS.OUTROS).nome
    : (r.situacao === "PROSPECT" ? "Prospect" : ROTULO_FUNIL[r.situacao] || r.situacao);
  $("resultados").innerHTML = error ? `<li class="sub" style="display:block">Não foi possível buscar: ${esc(error.message)}</li>`
    : resultadosBusca.length ? resultadosBusca.map((r, i) =>
      `<li data-r="${i}" tabindex="0"><span class="ponto" style="background:${cor(r)}"></span><div><div class="nome">${esc(r.nome)}</div><div class="sub">${esc(rotulo(r))} · ${esc(r.endereco)} · ${esc(r.bairro)}, ${esc(r.cidade)}</div></div></li>`).join("")
    : `<li class="sub" style="display:block">Nada encontrado com "${esc(t)}".</li>`;
  $("resultados").hidden = false;
}

async function irPara(r) {
  $("resultados").hidden = true; $("busca").blur();
  if (r.tipo === "PROSPECT") {
    // garante que o ponto apareça mesmo com nota baixa ou filtro de categoria ativo
    if (estado.notaMin > 0) { estado.notaMin = 0; $("nota-min").value = "0"; }
    if (estado.categoria) { estado.categoria = ""; $("categoria").value = ""; }
  }
  const g = r.tipo === "LOCAL" ? r.situacao : (r.situacao === "PROSPECT" ? "PROSPECT" : "OPORTUNIDADE");
  if (!estado.filtros.has(g)) { estado.filtros.add(g); document.querySelector(`[data-st="${g}"]`)?.setAttribute("aria-pressed", "true"); }
  await buscar(r.latitude, r.longitude, false);
  const d = estado.dados.find((x) => r.tipo === "LOCAL" ? x.chave_local === r.chave : x.cnpj === r.chave);
  if (d && d._m) { mapa.setView([d.latitude, d.longitude], 17); abrirFicha(d); }
}

// ---------- Follow-up ----------
const hojeISO = () => new Date().toISOString().slice(0, 10);

async function carregarFollow() {
  const base = "id,cnpj,chave_local,tipo,origem,status,ativado_em,canal,destino,proposta_enviada_em,retorno_em,observacao";
  const consulta = (pros, loc, extra = ",anotacoes(texto,criado_em)") => db.from("oportunidades").select(`${base},prospects(${pros}),locais(${loc})${extra}`)
    .in("status", ["ATIVADO", "PROPOSTA_ENVIADA", "EM_NEGOCIACAO"])
    .order("retorno_em", { ascending: true, nullsFirst: false });
  const pros = "nome_fantasia,razao_social,telefone1,bairro,cidade,segmento,latitude,longitude";
  const loc = "cliente,razao_social,contato,bairro,cidade,latitude,longitude,mensalidade_ultimo_contrato";
  let r = await consulta(pros + ",instagram", loc + ",instagram");
  if (r.error) r = await consulta(pros + ",instagram", loc);   // banco sem a coluna locais.instagram
  if (r.error) r = await consulta(pros, loc);                   // banco sem nenhuma coluna de Instagram
  if (r.error) r = await consulta(pros, loc, "");               // banco sem a tabela de anotações
  if (r.error) r = await db.from("oportunidades").select(base.replace(",origem", "") + `,prospects(${pros}),locais(${loc})`)
    .in("status", ["ATIVADO", "PROPOSTA_ENVIADA", "EM_NEGOCIACAO"]).order("retorno_em", { ascending: true, nullsFirst: false });
  return r;
}

async function contarFollow() {
  const { data } = await carregarFollow();
  const n = (data || []).filter((o) => o.retorno_em && o.retorno_em <= hojeISO()).length;
  $("n-follow").textContent = n ? `· ${n}` : "";
}

async function abrirFollow() {
  $("folha-follow").hidden = false;
  $("lista-follow").innerHTML = '<p class="sub">Carregando…</p>';
  let { data, error } = await carregarFollow();
  if (error) { $("lista-follow").innerHTML = `<p class="erro">Não foi possível carregar: ${esc(error.message)}</p>`; return; }
  const hoje = hojeISO();
  const origens = [...new Set(data.map((o) => o.origem || "Sem origem"))].sort();
  const filtro = estado.filtroOrigem && origens.includes(estado.filtroOrigem) ? estado.filtroOrigem : "";
  if (filtro) data = data.filter((o) => (o.origem || "Sem origem") === filtro);
  const cabecalho = `<label class="sub">Origem do lead <select id="fu-origem" class="chip"><option value="">Todas (${origens.length})</option>
    ${origens.map((o) => `<option${o === filtro ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
  const grupos = [
    ["Retorno hoje ou atrasado", data.filter((o) => o.retorno_em && o.retorno_em <= hoje)],
    ["Próximos retornos", data.filter((o) => o.retorno_em && o.retorno_em > hoje)],
    ["Ativados, proposta ainda não enviada", data.filter((o) => !o.retorno_em)],
  ];
  $("lista-follow").innerHTML = cabecalho + grupos.map(([titulo, itens]) => `<h3>${titulo} · ${itens.length}</h3>` +
    (itens.length ? itens.map(cartaoFollow).join("") : '<p class="sub">Nada aqui.</p>')).join("");
}

function cartaoFollow(o) {
  const l = o.locais;
  const p = o.prospects || (l ? { nome_fantasia: l.cliente, razao_social: l.razao_social, telefone1: l.contato, bairro: l.bairro,
    cidade: l.cidade, latitude: l.latitude, longitude: l.longitude, instagram: l.instagram,
    segmento: `Reativação · última mensalidade ${brl(l.mensalidade_ultimo_contrato)}` } : {});
  const k = o.chave_local ? "L:" + o.chave_local : o.cnpj, ke = esc(k);
  const nome = p.nome_fantasia || p.razao_social || o.cnpj;
  const atrasado = o.retorno_em && o.retorno_em < hojeISO();
  const linhaEnvio = o.proposta_enviada_em
    ? `Proposta por ${NOME_CANAL[o.canal] || o.canal} para ${esc(o.destino)} em ${dataBR(o.proposta_enviada_em)}`
    : `Ativado em ${dataBR(o.ativado_em)}`;
  const retorno = o.retorno_em ? `<span class="${atrasado ? "atrasado" : ""}">Retorno: ${dataBR(o.retorno_em)}</span>` : "";
  const whats = o.canal === "WHATSAPP" ? telWhats(o.destino) : telWhats(p.telefone1);
  return `<div class="fu"${l ? ' style="border-left:4px solid #e3b008"' : ""}><div class="nome">${esc(nome)}</div>
    <div class="sub">${esc(p.segmento || "")} · ${esc(p.bairro || "")}, ${esc(p.cidade || "")}</div>
    <div class="sub">${linhaEnvio}${retorno ? " · " + retorno : ""}${o.origem ? " · Origem: " + esc(o.origem) : ""}</div>
    ${o.observacao ? `<div class="sub">${esc(o.observacao)}</div>` : ""}
    ${(() => { const n = (o.anotacoes || []).slice().sort((a, b) => b.criado_em.localeCompare(a.criado_em));
      return n.length ? `<ul class="hist"><li><time>${dataHora(n[0].criado_em)}${n.length > 1 ? ` · ${n.length} anotações` : ""}</time>${esc(n[0].texto)}</li></ul>` : ""; })()}
    ${o.anotacoes ? `<div class="duas" style="align-items:end"><textarea id="fuanot-${o.id}" rows="1" placeholder="Nova anotação…"></textarea>
      <button type="button" class="fantasma" data-fu-anotar="${o.id}">Anotar</button></div>` : ""}
    <div class="acoes">
      ${whats ? `<button type="button" class="fantasma" data-fu-whats="${whats}">Abrir conversa</button>` : ""}
      ${p.instagram ? `<a class="fantasma" style="text-decoration:none" href="https://ig.me/m/${encodeURIComponent(p.instagram)}" target="_blank" rel="noopener">Direct @${esc(p.instagram)}</a>` : ""}
      <button type="button" class="fantasma" data-fu-mapa="${ke}" data-lat="${p.latitude}" data-lon="${p.longitude}">Ver no mapa</button>
      ${o.retorno_em ? `<button type="button" class="fantasma" data-fu-adiar="${ke}">Retorno feito · +${DIAS_RETORNO} dias</button>` : ""}
      <select class="fantasma" data-fu-status="${ke}" aria-label="Mudar situação">
        <option value="">Mudar situação…</option><option value="EM_NEGOCIACAO">Em negociação</option>
        <option value="GANHO">Ganho (fechou)</option><option value="PERDIDO">Perdido</option>
      </select>
    </div></div>`;
}

async function acaoFollow(e) {
  const an = e.target.closest("[data-fu-anotar]");
  if (an) {
    const campo = document.getElementById("fuanot-" + an.dataset.fuAnotar), texto = campo.value.trim();
    if (!texto) { campo.focus(); return; }
    an.disabled = true;
    const { error } = await db.from("anotacoes").insert({ oportunidade_id: +an.dataset.fuAnotar, texto });
    if (error) { an.disabled = false; an.textContent = "Erro: " + error.message; return; }
    abrirFollow(); return;
  }
  const w = e.target.closest("[data-fu-whats]");
  if (w) { window.open(`https://wa.me/55${w.dataset.fuWhats}`, "_blank", "noopener"); return; }
  const m = e.target.closest("[data-fu-mapa]");
  if (m) {
    $("folha-follow").hidden = true;
    await buscar(+m.dataset.lat, +m.dataset.lon, false);
    if (m.dataset.fuMapa.startsWith("L:")) estado.filtros.add("REATIVACAO");
    const d = acharPorChave(m.dataset.fuMapa);
    if (d && d._m) abrirFicha(d);
    return;
  }
  const a = e.target.closest("[data-fu-adiar]");
  if (a) {
    a.disabled = true;
    const novo = new Date(Date.now() + DIAS_RETORNO * 86400000).toISOString().slice(0, 10);
    const { error } = await db.from("oportunidades").update({ retorno_em: novo, atualizado_em: new Date().toISOString() }).eq(...alvo(a.dataset.fuAdiar));
    if (error) { a.disabled = false; a.textContent = "Erro: " + error.message; return; }
    abrirFollow(); contarFollow();
  }
}

async function mudarStatusFollow(e) {
  if (e.target.id === "fu-origem") { estado.filtroOrigem = e.target.value; abrirFollow(); return; }
  const sel = e.target.closest("[data-fu-status]"); if (!sel || !sel.value) return;
  const { error } = await db.from("oportunidades").update({ status: sel.value, atualizado_em: new Date().toISOString() }).eq(...alvo(sel.dataset.fuStatus));
  if (error) { sel.insertAdjacentHTML("afterend", `<span class="erro">${esc(error.message)}</span>`); return; }
  abrirFollow(); contarFollow();
}
</script>
</body>
